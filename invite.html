<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Приглашение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c; --gold-h:#dfc06a; --gold-soft:rgba(201,168,76,.14);
  --text:#e6dfd5; --muted:#9a8f80; --border:#2e2820;
  --tr:.25s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',sans-serif;background:#0c0b0a;color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* ===== LOADING ===== */
#loading{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0c0b0a;z-index:900;flex-direction:column;gap:16px;
}
.spinner{
  width:38px;height:38px;border:2px solid var(--border);border-top-color:var(--gold);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--muted)}

/* ===== ERROR ===== */
#error{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:#0c0b0a;z-index:900;padding:20px;text-align:center;
}
#error .box{max-width:360px}
#error h2{color:var(--gold);font-size:18px;margin-bottom:10px}
#error p{font-size:13px;color:var(--muted);line-height:1.6}

/* ===== WRAP SCREEN (конверт/сундук) ===== */
#wrapScreen{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:800;cursor:pointer;overflow:hidden;
  background:radial-gradient(ellipse at center, #1a1714 0%, #0c0b0a 100%);
}
#wrapScreen.show{display:flex}
.wrap-hint{
  position:absolute;bottom:60px;left:0;right:0;text-align:center;
  font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ENVELOPE */
.envelope{
  position:relative;width:280px;height:190px;
  perspective:1000px;transition:transform .6s;
}
.envelope .back{
  position:absolute;inset:0;background:linear-gradient(135deg,#2a2418,#1e1a12);
  border:1px solid var(--gold);border-radius:6px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(201,168,76,.15);
}
.envelope .letter{
  position:absolute;left:10px;right:10px;top:-120px;height:170px;
  background:linear-gradient(180deg,#fdfbf7,#f0e8da);border-radius:4px;
  transition:top .8s cubic-bezier(.4,0,.2,1);z-index:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.envelope .letter span{
  font-family:'Playfair Display',serif;font-size:22px;color:#8c6d3b;
}
.envelope .front{
  position:absolute;inset:0;z-index:2;
  background:linear-gradient(135deg,#3a3020,#2a2418);
  border:1px solid var(--gold);border-radius:6px;
  clip-path:polygon(0 100%, 0 40%, 50% 75%, 100% 40%, 100% 100%);
}
.envelope .flap{
  position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,#4a3c26,#3a3020);
  border:1px solid var(--gold);border-top-left-radius:6px;border-top-right-radius:6px;
  transform-origin:top;transition:transform .8s cubic-bezier(.4,0,.2,1);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  z-index:3;
}
.envelope .seal{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--gold-h), var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:18px;color:#0c0b0a;font-weight:600;
  box-shadow:0 4px 16px rgba(201,168,76,.5);z-index:4;transition:opacity .4s;
}
.envelope.opening .flap{transform:rotateX(180deg)}
.envelope.opening .letter{top:-170px}
.envelope.opening .seal{opacity:0}

/* CHEST */
.chest{
  position:relative;width:260px;height:200px;perspective:1000px;
}
.chest .body{
  position:absolute;bottom:0;left:0;right:0;height:130px;
  background:linear-gradient(180deg,#3a2a1a,#241a0e);
  border:2px solid var(--gold);border-radius:6px 6px 10px 10px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 30px rgba(201,168,76,.1);
}
.chest .body::before{
  content:'';position:absolute;inset:10px;border:1px solid rgba(201,168,76,.3);border-radius:4px;
}
.chest .lid{
  position:absolute;top:20px;left:0;right:0;height:80px;
  background:linear-gradient(180deg,#4a3620,#3a2a1a);
  border:2px solid var(--gold);border-radius:10px 10px 0 0;
  transform-origin:bottom;transition:transform .9s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  clip-path:polygon(0 100%, 0 20%, 15% 0, 85% 0, 100% 20%, 100% 100%);
}
.chest .lock{
  position:absolute;top:70px;left:50%;transform:translateX(-50%);
  width:36px;height:36px;background:radial-gradient(circle at 30% 30%, var(--gold-h), var(--gold));
  border-radius:6px;z-index:5;transition:opacity .4s,transform .4s;
  box-shadow:0 4px 16px rgba(201,168,76,.5);
}
.chest .lock::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:6px;height:10px;background:#0c0b0a;border-radius:3px;
}
.chest .glow{
  position:absolute;top:70px;left:50%;transform:translateX(-50%);
  width:200px;height:100px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(201,168,76,.8), transparent 70%);
  opacity:0;transition:opacity .6s;z-index:0;filter:blur(20px);
}
.chest.opening .lid{transform:rotateX(-110deg)}
.chest.opening .lock{opacity:0;transform:translateX(-50%) scale(.5)}
.chest.opening .glow{opacity:1}

/* ORIENTAL */
.oriental{
  position:relative;width:280px;height:200px;
  background:linear-gradient(135deg,#1c1814,#2a2015);
  border:3px double var(--gold);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(201,168,76,.15);
  transition:transform .8s;
}
.oriental::before,.oriental::after{
  content:'✦';position:absolute;color:var(--gold);font-size:20px;
}
.oriental::before{top:10px;left:14px}
.oriental::after{bottom:10px;right:14px}
.oriental .inner{
  font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);
  letter-spacing:3px;
}
.oriental.opening{transform:scale(1.05);opacity:0;transition:all .8s}

/* ===== MAIN INVITE ===== */
#invite{
  position:fixed;inset:0;overflow-y:auto;display:none;
  scroll-behavior:smooth;background:#1a1714;
}
#invite.show{display:block}
#invite::-webkit-scrollbar{width:4px}
#invite::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}

.sec{
  padding:38px 24px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);
  position:relative;opacity:0;transform:translateY(30px);
  transition:opacity .8s ease,transform .8s ease;
  max-width:600px;margin:0 auto;
}
.sec.visible{opacity:1;transform:translateY(0)}
.sec:last-child{border-bottom:none}
.sec-title{
  font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:16px;
}
.sec-names{
  font-family:'Playfair Display',serif;font-size:36px;font-weight:600;
  line-height:1.3;margin:18px 0;
}
.sec-msg{font-size:14px;font-style:italic;opacity:.85;margin:12px 0;line-height:1.6}
.sec-photo{
  width:120px;height:120px;border-radius:50%;object-fit:cover;margin:14px auto;
  display:block;border:3px solid;box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.sec p{font-size:14px;line-height:1.7;white-space:pre-line}
.sec .muted{font-size:12px;color:var(--muted)}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:8px}

.cover-video{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin:12px 0}

.map-img{width:100%;border-radius:10px;margin:10px 0}
.map-link{
  display:inline-block;font-size:12px;color:var(--gold);
  text-decoration:none;padding:8px 16px;border:1px solid var(--gold);
  border-radius:20px;margin-top:8px;transition:all var(--tr);
}
.map-link:hover{background:var(--gold-soft)}

/* ===== RSVP ===== */
.rsvp-form{
  max-width:340px;margin:16px auto 0;display:flex;flex-direction:column;gap:10px;
}
.rsvp-form input,.rsvp-form select{
  padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:var(--text);font-size:13px;font-family:inherit;
}
.rsvp-form input:focus,.rsvp-form select:focus{outline:none;border-color:var(--gold)}
.rsvp-toggle{display:flex;gap:8px}
.rsvp-toggle button{
  flex:1;padding:12px;border-radius:10px;border:1px solid;
  background:transparent;cursor:pointer;font-size:13px;font-weight:500;
  transition:all var(--tr);font-family:inherit;
}
.rsvp-toggle button.active{color:#0c0b0a}
.rsvp-submit{
  padding:14px;border-radius:10px;border:none;cursor:pointer;font-size:14px;
  font-weight:600;color:#0c0b0a;transition:all var(--tr);font-family:inherit;
}
.rsvp-submit:disabled{opacity:.5;cursor:not-allowed}
.rsvp-done{
  padding:16px;border-radius:10px;background:rgba(201,168,76,.1);
  border:1px solid rgba(201,168,76,.3);font-size:13px;line-height:1.6;
}

/* ===== WISHES ===== */
.wish-form{max-width:340px;margin:16px auto 0;display:flex;flex-direction:column;gap:10px}
.wish-form input,.wish-form textarea{
  padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:var(--text);font-size:13px;font-family:inherit;
  resize:vertical;
}
.wish-form input:focus,.wish-form textarea:focus{outline:none;border-color:var(--gold)}
.wish-form textarea{min-height:80px}
.wish-list{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.wish-card{
  padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);text-align:left;
}
.wish-card .who{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:4px}
.wish-card .what{font-size:13px;line-height:1.55}
.wish-empty{font-size:12px;color:var(--muted);padding:16px;text-align:center}

/* ===== SOCIAL ===== */
.social-row{display:flex;gap:12px;justify-content:center;margin-top:12px}
.social-row a{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);transition:all var(--tr);color:var(--text);
}
.social-row a:hover{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.social-row svg{width:20px;height:20px;fill:currentColor}

/* ===== FRAMES ===== */
.frame-classic::before{content:'';position:fixed;inset:12px;border:1px solid rgba(201,168,76,.3);pointer-events:none;z-index:5}
.frame-double::before{content:'';position:fixed;inset:10px;border:2px double rgba(201,168,76,.4);pointer-events:none;z-index:5}
.frame-ornate::before{content:'';position:fixed;inset:8px;border:2px solid rgba(201,168,76,.5);border-radius:4px;pointer-events:none;z-index:5}
.frame-gold::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 0 4px #c9a84c,inset 0 0 0 8px #1a1714,inset 0 0 0 9px rgba(201,168,76,.4);pointer-events:none;z-index:5}
.frame-floral::before{content:'✦';position:fixed;top:20px;left:20px;color:rgba(201,168,76,.6);font-size:20px;z-index:5;pointer-events:none}
.frame-floral::after{content:'✦';position:fixed;bottom:20px;right:20px;color:rgba(201,168,76,.6);font-size:20px;z-index:5;pointer-events:none}

/* ===== MUSIC BTN ===== */
#musicBtn{
  position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:50%;
  background:rgba(201,168,76,.15);border:1px solid var(--gold);cursor:pointer;
  display:none;align-items:center;justify-content:center;z-index:600;
  backdrop-filter:blur(10px);transition:all var(--tr);
}
#musicBtn.show{display:flex}
#musicBtn:hover{background:rgba(201,168,76,.3);transform:scale(1.05)}
#musicBtn svg{width:20px;height:20px;fill:var(--gold)}
#musicBtn.playing svg{animation:musicPulse 1.5s ease-in-out infinite}
@keyframes musicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#27221c;color:var(--text);padding:12px 24px;border-radius:30px;
  border:1px solid rgba(201,168,76,.4);font-size:13px;z-index:1000;opacity:0;
  transition:all .35s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.45);
  max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== SPARKLES ===== */
.spark{
  position:fixed;width:4px;height:4px;background:var(--gold);border-radius:50%;
  pointer-events:none;z-index:9999;animation:sparkAnim 1.8s ease-out forwards;
}
@keyframes sparkAnim{
  0%{opacity:1;transform:scale(0) translateY(0)}
  50%{opacity:1;transform:scale(1.3) translateY(-40px)}
  100%{opacity:0;transform:scale(0) translateY(-80px)}
}

@media(min-width:768px){
  .sec{padding:50px 32px}
  .sec-names{font-size:44px}
  .gallery img{height:180px}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p>Загрузка приглашения...</p>
</div>

<!-- ERROR -->
<div id="error">
  <div class="box">
    <h2>Приглашение не найдено</h2>
    <p>Проверьте ссылку или обратитесь к организатору.</p>
  </div>
</div>

<!-- WRAP SCREEN -->
<div id="wrapScreen">
  <div class="wrap-hint">Нажмите, чтобы открыть</div>
</div>

<!-- MUSIC -->
<button id="musicBtn" aria-label="Музыка">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</button>

<!-- INVITE -->
<div id="invite"></div>

<audio id="bgAudio" loop preload="auto"></audio>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const inviteId = params.get('id');

let data = null;
let audio = document.getElementById('bgAudio');
let musicPlaying = false;
let autoScrollTimer = null;

/* ============ LOAD ============ */
async function loadInvite(){
  if(!inviteId){ showError(); return; }
  try {
    const snap = await getDoc(doc(db, 'invitations', inviteId));
    if(!snap.exists()){ showError(); return; }
    data = snap.data();
    document.getElementById('loading').style.display = 'none';
    buildWrap();
    buildInvite();
    if(data.toggles?.music && data.music?.url){
      audio.src = data.music.url;
      audio.volume = (parseInt(data.music.volume)||60)/100;
    }
  } catch(e){ console.error(e); showError(); }
}

function showError(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
}

/* ============ WRAP ============ */
function buildWrap(){
  const wrap = document.getElementById('wrapScreen');
  const style = data.wrapStyle || 'envelope';
  if(style === 'none'){ openInvite(); return; }

  if(style === 'envelope'){
    wrap.innerHTML = `
      <div class="wrap-hint">Нажмите, чтобы открыть</div>
      <div class="envelope" id="wrapEl">
        <div class="letter"><span>${data.names?.name1 || ''} & ${data.names?.name2 || ''}</span></div>
        <div class="back"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">${(data.names?.name1||'A')[0]}</div>
      </div>`;
  } else if(style === 'chest'){
    wrap.innerHTML = `
      <div class="wrap-hint">Нажмите, чтобы открыть сундук</div>
      <div class="chest" id="wrapEl">
        <div class="glow"></div>
        <div class="body"></div>
        <div class="lid"></div>
        <div class="lock"></div>
      </div>`;
  } else if(style === 'oriental'){
    wrap.innerHTML = `
      <div class="wrap-hint">Нажмите, чтобы открыть</div>
      <div class="oriental" id="wrapEl">
        <div class="inner">${data.names?.name1 || ''} & ${data.names?.name2 || ''}</div>
      </div>`;
  }
  wrap.classList.add('show');
  const el = document.getElementById('wrapEl');
  wrap.onclick = () => {
    if(el.classList.contains('opening')) return;
    el.classList.add('opening');
    startMusic();
    spawnSparkles();
    setTimeout(() => {
      wrap.classList.remove('show');
      openInvite();
    }, 900);
  };
}

function openInvite(){
  document.getElementById('wrapScreen').classList.remove('show');
  document.getElementById('invite').classList.add('show');
  if(data.toggles?.music && data.music?.url){
    document.getElementById('musicBtn').classList.add('show');
    startMusic();
  }
  if(data.toggles?.autoScroll !== false){
    startAutoScroll();
  }
  setTimeout(revealSections, 100);
}

/* ============ MUSIC ============ */
function startMusic(){
  if(!data.toggles?.music || !data.music?.url) return;
  audio.play().then(() => {
    musicPlaying = true;
    document.getElementById('musicBtn').classList.add('playing');
  }).catch(e => console.log('Autoplay blocked:', e));
}
document.getElementById('musicBtn').onclick = () => {
  if(musicPlaying){ audio.pause(); musicPlaying = false; document.getElementById('musicBtn').classList.remove('playing'); }
  else { audio.play(); musicPlaying = true; document.getElementById('musicBtn').classList.add('playing'); }
};

/* ============ SPARKLES ============ */
function spawnSparkles(){
  if(!data.toggles?.sparkles) return;
  for(let i=0;i<20;i++){
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = (20 + Math.random()*60) + '%';
      s.style.top = (20 + Math.random()*50) + '%';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1800);
    }, i * 70);
  }
}

/* ============ BUILD INVITE ============ */
function buildInvite(){
  const host = document.getElementById('invite');
  host.innerHTML = '';
  const bg = data.colors?.bg || '#1a1714';
  const text = data.colors?.text || '#e6dfd5';
  const title = data.colors?.title || '#c9a84c';
  const accent = data.colors?.accent || '#c9a84c';
  const fTitle = data.fonts?.title || 'Playfair Display';
  const fText = data.fonts?.text || 'Inter';
  host.style.background = bg;
  host.style.color = text;
  host.style.fontFamily = fText + ',sans-serif';
  if(data.frame && data.frame !== 'none') host.classList.add('frame-' + data.frame);

  const blocks = data.blocks || [];
  blocks.forEach(b => {
    if(!b.enabled) return;
    if(b.id === 'wishes' && !data.toggles?.wishes) return;
    if(b.id === 'social' && !data.toggles?.social) return;
    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.dataset.blockId = b.id;
    let html = '';
    switch(b.id){
      case 'cover':
        let vid = '';
        if(data.toggles?.video && data.video?.url){
          vid = `<video class="cover-video" src="${data.video.url}" muted loop autoplay playsinline></video>`;
        }
        html = `
          <p style="font-size:10px;letter-spacing:3px;color:${accent};text-transform:uppercase;margin-bottom:8px">Приглашение на торжество</p>
          ${vid}
          ${data.toggles?.photo ? (data.images?.cover ? `<img class="sec-photo" src="${data.images.cover}" style="border-color:${accent}">` : '') : ''}
          <div class="sec-names" style="color:${title}">${data.names?.name1||''}<br><span style="font-size:20px;opacity:.6">&</span><br>${data.names?.name2||''}</div>
          ${data.message?.enabled ? `<p class="sec-msg">«${data.message.text||''}»</p>` : ''}
          ${data.witnesses?.enabled ? `<p style="font-size:12px;margin-top:12px;opacity:.8"><strong>Свидетели:</strong> ${data.witnesses.w1||'…'} & ${data.witnesses.w2||'…'}</p>` : ''}

        break;

        break;
      case 'venue':

                <p style="font-size:15px;font-weight:500">${data.content?.venueName||''}</p>
                ${data.images?.map ? `<img class="map-img" src="${data.images.map}" alt="Карта">` : ''}
                ${data.content?.venueMapLink ? `<a class="map-link" href="${data.content.venueMapLink}" target="_blank" rel="noopener">Открыть на карте</a>` : ''}`;
        break;
      case 'seating':
        html = `<div class="sec-title" style="color:${title}">Рассадка</div>
                <div style="font-size:13px;background:rgba(255,255,255,.04);padding:14px;border-radius:10px;text-align:left;white-space:pre-line">${data.content?.seating||''}</div>`;
        break;
      case 'wishes':
        html = `<div class="sec-title" style="color:${title}">${data.content?.wishesTitle||'Пожелания гостей'}</div>
                <div id="wishFormHost"></div>
                <div class="wish-list" id="wishList"></div>`;
        break;
      case 'rsvp':
        html = `<div class="sec-title" style="color:${title}">${data.content?.rsvpTitle||'Подтверждение присутствия'}</div>
                <div id="rsvpHost"></div>`;
        break;
      case 'social':
        html = `<div class="sec-title" style="color:${title}">Поделиться</div>
                <div class="social-row">
                  <a href="https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(data.content?.shareText||'')}" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></a>
                  <a href="https://wa.me/?text=${encodeURIComponent((data.content?.shareText||'') + ' ' + location.href)}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm5.6 14.2c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9 0-1.4.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.1.3-.3.5-.1.2-.3.4-.4.5-.2.1-.3.3-.1.6.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.8.3.1.5.1.7-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.7-.1.2.1 1.6.7 1.8.9.3.1.5.2.5.3.1.1.1.7-.1 1.3z"/></svg></a>
                  <a href="#" onclick="copyLink();return false;" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.1.4.3 1 .4 2.2.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.1-1 .3-2.2.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.1-.4-.3-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.1 1-.3 2.2-.4 1.2-.1 1.6-.1 4.8-.1zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.2.8-.4.3-.6.7-.8 1.2-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.2.3.4.7.6 1.2.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.2-.8.4-.3.6-.7.8-1.2.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.2-.3-.4-.7-.6-1.2-.8-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.1a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8zm0 8a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zm6.2-8.2a1.1 1.1 0 1 1-2.3 0 1.1 1.1 0 0 1 2.3 0z"/></svg></a>
                  <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7C18.3 21.1 22 17 22 12c0-5.5-4.5-10-10-10z"/></svg></a>
                </div>`;
        break;
    }
    sec.innerHTML = html;
    host.appendChild(sec);
  });

  // custom sections
  (data.customSections || []).forEach(s => {
    if(!s.enabled || (!s.title && !s.body)) return;
    const sec = document.createElement('section');
    sec.className = 'sec';
    sec.innerHTML = `<div class="sec-title" style="color:${title}">${s.title||''}</div><p>${s.body||''}</p>`;
    host.appendChild(sec);
  });

  // init interactive parts
  initRSVP(accent);
  initWishes(accent);
}

/* ============ RSVP ============ */
function initRSVP(accent){
  const host = document.getElementById('rsvpHost');
  if(!host) return;
  let attending = null;
  host.innerHTML = `
    <div class="rsvp-form">
      <input type="text" id="rsvpName" placeholder="Ваше имя" maxlength="80">
      <div class="rsvp-toggle">
        <button type="button" id="rsvpYes" style="border-color:${accent}">Приду</button>
        <button type="button" id="rsvpNo" style="border-color:${accent}">Не приду</button>
      </div>
      <div id="rsvpGuestsWrap" style="display:none">
        <select id="rsvpGuests">
          <option value="1">1 гость</option>
          <option value="2">2 гостя</option>
          <option value="3">3 гостя</option>
          <option value="4">4 гостя</option>
          <option value="5">5 гостей</option>
        </select>
      </div>
      <button type="button" class="rsvp-submit" id="rsvpSubmit" style="background:${accent}" disabled>${data.content?.rsvpText||'Подтвердить'}</button>
    </div>`;
  const yes = document.getElementById('rsvpYes');
  const no = document.getElementById('rsvpNo');
  const submit = document.getElementById('rsvpSubmit');
  const guestsWrap = document.getElementById('rsvpGuestsWrap');
  yes.onclick = () => {
    attending = true;
    yes.style.background = accent; yes.style.color = '#0c0b0a';
    no.style.background = 'transparent'; no.style.color = accent;
    guestsWrap.style.display = 'block';
    submit.disabled = false;
  };
  no.onclick = () => {
    attending = false;
    no.style.background = accent; no.style.color = '#0c0b0a';
    yes.style.background = 'transparent'; yes.style.color = accent;
    guestsWrap.style.display = 'none';
    submit.disabled = false;
  };
  submit.onclick = async () => {
    const name = document.getElementById('rsvpName').value.trim();
    if(!name){ toast('Введите имя'); return; }
    if(attending === null){ toast('Выберите вариант'); return; }
    submit.disabled = true; submit.textContent = 'Отправка...';
    try {
      await addDoc(collection(db, 'rsvps'), {
        inviteId,
        name,
        attending,
        guests: attending ? parseInt(document.getElementById('rsvpGuests').value) : 0,
        createdAt: serverTimestamp()
      });
      host.innerHTML = `<div class="rsvp-done">Спасибо, ${name}! Ваш ответ получен.</div>`;
    } catch(e){ toast('Ошибка: ' + e.message); submit.disabled = false; submit.textContent = data.content?.rsvpText||'Подтвердить'; }
  };
}

/* ============ WISHES ============ */
function initWishes(accent){
  const formHost = document.getElementById('wishFormHost');
  const listHost = document.getElementById('wishList');
  if(!formHost || !listHost) return;

  formHost.innerHTML = `
    <div class="wish-form">
      <input type="text" id="wishName" placeholder="Ваше имя" maxlength="60">
      <textarea id="wishText" placeholder="Ваше пожелание..." maxlength="500"></textarea>
      <button type="button" class="rsvp-submit" id="wishSubmit" style="background:${accent}">Оставить пожелание</button>
    </div>`;

  const submit = document.getElementById('wishSubmit');
  submit.onclick = async () => {
    const name = document.getElementById('wishName').value.trim();
    const text = document.getElementById('wishText').value.trim();
    if(!name || !text){ toast('Заполните имя и пожелание'); return; }
    submit.disabled = true; submit.textContent = 'Отправка...';
    try {
      await addDoc(collection(db, 'wishes'), {
        inviteId,
        name,
        text,
        approved: false,
        createdAt: serverTimestamp()
      });
      formHost.innerHTML = `<div class="rsvp-done">${data.content?.wishesThanks||'Спасибо! Пожелание появится после проверки.'}</div>`;
      toast('Пожелание отправлено');
    } catch(e){ toast('Ошибка: ' + e.message); submit.disabled = false; submit.textContent = 'Оставить пожелание'; }
  };

  // realtime list of approved wishes
  const q = query(
    collection(db, 'wishes'),
    where('inviteId', '==', inviteId),
    where('approved', '==', true)
  );
  onSnapshot(q, snap => {
    const wishes = [];
    snap.forEach(d => wishes.push(d.data()));
    wishes.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    if(!wishes.length){
      listHost.innerHTML = `<div class="wish-empty">Пока пожеланий нет. Будьте первым!</div>`;
    } else {
      listHost.innerHTML = wishes.map(w => `
        <div class="wish-card">
          <div class="who">${escapeHtml(w.name)}</div>
          <div class="what">${escapeHtml(w.text)}</div>
        </div>`).join('');
    }
  }, err => console.error('wishes listener:', err));
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ REVEAL ON SCROLL ============ */
function revealSections(){
  const secs = document.querySelectorAll('.sec');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  secs.forEach(s => obs.observe(s));
}

/* ============ AUTO SCROLL ============ */
function startAutoScroll(){
  const secs = document.querySelectorAll('.sec');
  if(secs.length < 2) return;
  const interval = (parseInt(data.autoScrollSec) || 6) * 1000;
  let idx = 0;
  let userInterrupted = false;
  const interrupt = () => { userInterrupted = true; stopAutoScroll(); };
  document.getElementById('invite').addEventListener('touchstart', interrupt, {once:true, passive:true});
  document.getElementById('invite').addEventListener('wheel', interrupt, {once:true, passive:true});
  autoScrollTimer = setInterval(() => {
    if(userInterrupted) return;
    idx++;
    if(idx >= secs.length){ stopAutoScroll(); return; }
    secs[idx].scrollIntoView({ behavior:'smooth', block:'start' });
  }, interval);
}
function stopAutoScroll(){ if(autoScrollTimer){ clearInterval(autoScrollTimer); autoScrollTimer = null; } }

/* ============ LINK COPY ============ */
function copyLink(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(location.href).then(()=>toast('Ссылка скопирована — вставьте в Instagram')).catch(()=>toast(location.href));
  } else toast(location.href);
}

/* ============ TOAST ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

window.copyLink = copyLink;

loadInvite();
</script>
